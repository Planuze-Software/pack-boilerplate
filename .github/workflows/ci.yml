name: Verify pack

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-pack-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Source placeholder, manifest, docs and generator
    # Boilerplate público: runner efêmero standard é gratuito e mantém código de forks fora das
    # máquinas persistentes privadas da Planuze.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout pack as source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          clean: true

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Install locked validation tools
        run: npm ci --ignore-scripts

      - name: Verify source placeholder and pack
        run: npm run verify

      - name: Reject example identity outside the canonical boilerplate
        run: npm run check:release-ready
